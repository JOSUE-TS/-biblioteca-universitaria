<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuarios | Biblioteca Universitaria</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Arial, sans-serif;
    }
    .contenedor {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 24px #0f172a1a;
    }
    h1 { margin: 0 0 10px; font-size: 23px; }
    .descripcion { color: #64748b; margin: 0 0 24px; line-height: 1.5; }
    label { display: block; font-weight: bold; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #94a3b8;
      border-radius: 7px;
      font: inherit;
    }
    input:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      background: #1d4ed8;
      color: white;
      font: inherit;
      font-weight: bold;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    .mensaje { margin-top: 16px; padding: 12px; border-radius: 7px; display: none; }
    .exito { display: block; color: #166534; background: #dcfce7; }
    .error { display: block; color: #991b1b; background: #fee2e2; }
    .nota { font-size: 12px; color: #64748b; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="contenedor">
    <h1>Registro de usuarios</h1>
    <p class="descripcion">Sistema de Biblioteca Universitaria</p>

    <form id="formularioRegistro" novalidate>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" maxlength="100" autocomplete="name" required placeholder="Ej. Ana Torres">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" maxlength="150" autocomplete="email" required placeholder="Ej. ana@correo.com">

      <button type="submit">Registrar usuario</button>
      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    </form>

    <p class="nota">Prototipo de clase: valida el formulario, pero todavía no guarda datos en MySQL.</p>
  </main>

  <script>
    const formulario = document.getElementById('formularioRegistro');
    const mensaje = document.getElementById('mensaje');
    const nombre = document.getElementById('nombre');
    const correo = document.getElementById('correo');

    function mostrarMensaje(texto, clase) {
      mensaje.textContent = texto;
      mensaje.className = `mensaje ${clase}`;
    }

    formulario.addEventListener('submit', function (evento) {
      evento.preventDefault();
      const nombreIngresado = nombre.value.trim();
      correo.value = correo.value.trim();
      const correoIngresado = correo.value;

      if (!nombreIngresado || !correoIngresado) {
        mostrarMensaje('Debes completar el nombre y el correo electrónico.', 'error');
        return;
      }

      if (!correo.validity.valid) {
        mostrarMensaje('Ingresa un correo electrónico válido.', 'error');
        return;
      }

      mostrarMensaje(`Registro validado correctamente para ${nombreIngresado}.`, 'exito');
      formulario.reset();
    });
  </script>
</body>
</html>
